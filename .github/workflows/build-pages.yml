name: Build Project & List Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-pages
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 6 * * *'  # Daily at 06:30 UTC (30 min after release-monitor)
  push:
    branches: [main]
    paths:
      - 'data/repos.json'
      - 'data/lists.json'
      - 'data/latest-release.json'
      - 'scripts/build-pages.js'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so computeAddedDates() in build-pages.js can walk the
          # git log of data/repos.json for per-repo first-seen dates. A shallow
          # clone (default depth 1) collapses every RSS <pubDate> to the latest
          # commit time.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate-summaries.js

      - name: Build project pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-pages.js

      - name: Check for changes
        id: diff
        run: |
          # Stage generated artifacts through a repo-owned manifest instead of
          # hand-maintaining pathspecs in this workflow. If a generator emits a
          # new path that is not in the manifest, the script fails loudly so the
          # artifact cannot be silently dropped from the bot commit.
          node scripts/stage-build-artifacts.js
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            PAGES=$(find projects -name '*.html' | wc -l)
            LISTS=$(find lists -name '*.html' | wc -l)
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "pages=$PAGES" >> $GITHUB_OUTPUT
            echo "lists=$LISTS" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated pages
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config user.name "Hermes Atlas Bot"
          git config user.email "bot@hermesatlas.com"
          git commit -m "Rebuild project pages (${{ steps.diff.outputs.pages }} projects, ${{ steps.diff.outputs.lists }} lists)"

          # main can move during a multi-minute build (PR merge, another
          # bot workflow committing). Generated pages should never be rebased:
          # almost every artifact changes together, so a new generated commit
          # on main produces hundreds of conflicts. On rejection, discard only
          # this ephemeral runner's generated commit, reset to the latest main,
          # and deterministically regenerate from that complete input state.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — regenerating from latest main"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            node scripts/generate-summaries.js
            node scripts/build-pages.js
            node scripts/stage-build-artifacts.js
            if git diff --cached --quiet; then
              echo "Latest main already contains the generated artifacts"
              exit 0
            fi
            PAGES=$(find projects -name '*.html' | wc -l)
            LISTS=$(find lists -name '*.html' | wc -l)
            git commit -m "Rebuild project pages ($PAGES projects, $LISTS lists)"
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Ping IndexNow with changed URLs
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/indexnow-ping.js

      - name: Close prior failure alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label workflow-issue --search '"[Workflow] build-pages failed" in:title' --json number --jq '.[].number' |
            while read issue; do
              gh issue close "$issue" --comment "Recovered in workflow run ${GITHUB_RUN_ID}."
            done

      # Escalate silent failures. This workflow runs daily and gates what is live
      # on hermesatlas.com; without this a failed run was only a red X in the
      # Actions tab. Opens (or comments on a deduped) workflow-issue.
      - name: Escalate on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = 'build-pages';
            const title = `[Workflow] ${wf} failed`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The **${wf}** workflow failed — it gates what is live on hermesatlas.com.\n\n**Run:** ${runUrl}\n\nCheck the run log (npm install, generator error, OpenRouter/GitHub API, or the push-retry loop).`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'workflow-issue'
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['workflow-issue']
              });
            }
