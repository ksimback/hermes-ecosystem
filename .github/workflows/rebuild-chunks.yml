name: Rebuild Knowledge Base Chunks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: rebuild-chunks
  cancel-in-progress: false

on:
  schedule:
    # Daily reconciliation after release-monitor. Push/dispatch events remain
    # the fast path; this catches a missed or externally cancelled event.
    - cron: '20 6 * * *'
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'repos/*.md'
      - 'ECOSYSTEM.md'
      - 'data/repos.json'
      # Use-case bundles are synthesized into retrievable pages by
      # build-chunks.js, so editing a bundle (or the corpus it cites) must
      # re-embed them or the KB serves the previous stack.
      - 'data/use-cases.json'
      - 'data/user-stories.json'
      - 'drafts/handbook-hub.md'
      - 'drafts/handbook-vs-claude-code.md'
      - 'scripts/build-chunks.js'
      - 'lib/chunk-text.js'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Rebuild chunks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/build-chunks.js

      - name: Check if generated knowledge data changed
        id: diff
        run: |
          git diff --stat data/chunks-meta.json data/embeddings.bin data/latest-release.json
          if git diff --quiet data/chunks-meta.json data/embeddings.bin data/latest-release.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            CHUNKS=$(node -e "const c=require('./data/chunks-meta.json');console.log(c.count)")
            echo "count=$CHUNKS" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated knowledge data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Hermes Atlas Bot"
          git config user.email "bot@hermesatlas.com"
          git add data/chunks-meta.json data/embeddings.bin data/latest-release.json
          git commit -m "Rebuild knowledge base chunks (${{ steps.diff.outputs.count }} chunks)"

          # main can move during a multi-minute build (PR merge, another
          # bot workflow committing) — vanilla `git push` then fails with
          # `! [rejected] main -> main (fetch first)`. Retry up to 3 times,
          # rebasing onto the new remote tip between attempts.
          #
          # `-X theirs` on rebase auto-resolves conflicts in our favour
          # (during rebase, "theirs" = the commit being replayed = ours).
          # Chunk-store conflicts are guaranteed when two runs both modify
          # it because OpenRouter embeddings aren't byte-deterministic, and
          # the two outputs are semantically equivalent (built from the same
          # source), so keeping ours is safe — for the binary embeddings.bin
          # "theirs" takes our whole file, which is exactly right. If the
          # conflict is in a file we did NOT modify, `-X theirs` still keeps
          # origin/main's version (only our local-commit-touched paths get
          # auto-resolved).
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling --rebase and retrying"
            git pull --rebase -X theirs origin main || { echo "Rebase failed — aborting"; exit 1; }
          done
          echo "Push failed after 3 attempts"
          exit 1

      # Commits made with GITHUB_TOKEN do not trigger another workflow from a
      # push event. Dispatch the page build explicitly so latest-release.json
      # reaches the static homepage instead of stopping at the RAG artifact.
      - name: Dispatch page rebuild
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-pages.yml',
              ref: 'main'
            });
            console.log('Dispatched build-pages.yml after knowledge data update');

      - name: Close prior failure alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label workflow-issue --search '"[Workflow] rebuild-chunks failed" in:title' --json number --jq '.[].number' |
            while read issue; do
              gh issue close "$issue" --comment "Recovered in workflow run ${GITHUB_RUN_ID}."
            done

      # Escalate silent failures — this workflow rebuilds the RAG knowledge base
      # that Ask the Atlas answers from; a failed run was previously only a red X.
      - name: Escalate on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = 'rebuild-chunks';
            const title = `[Workflow] ${wf} failed`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The **${wf}** workflow failed — it rebuilds the Ask-the-Atlas knowledge base.\n\n**Run:** ${runUrl}\n\nCheck the run log (OpenRouter embeddings, the chunk-store write, or the push-retry loop).`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'workflow-issue'
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['workflow-issue']
              });
            }
