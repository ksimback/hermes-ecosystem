name: Refresh GitHub Stars

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-github-stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch and publish a validated snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/push-stars-snapshot.js

      - name: Close prior failure alerts after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label workflow-issue --search '"[Workflow] GitHub stars refresh failed" in:title' --json number --jq '.[].number' |
            while read issue; do
              gh issue close "$issue" --comment "Recovered in workflow run ${GITHUB_RUN_ID}."
            done

      - name: Open one actionable failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Workflow] GitHub stars refresh failed';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-issue',
              per_page: 100
            });
            const body = `The scheduled stars snapshot failed or GitHub reported an unavailable catalog repository.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe API exposes stale and complete separately, so a partial or old snapshot cannot masquerade as healthy.`;
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['workflow-issue']
              });
            }
