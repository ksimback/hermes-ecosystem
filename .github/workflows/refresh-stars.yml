name: Refresh GitHub Stars

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-github-stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch and publish a validated snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/push-stars-snapshot.js

      # Publication above uses the ACTIONS token, so it proves nothing about the
      # GITHUB_TOKEN configured in Vercel. api/stars.js only reaches for that one
      # when the cached snapshot is cold, and degrades silently when it fails —
      # so an expired token stays invisible until the cache also expires. This
      # forces the live path every run and fails loud instead.
      #
      # Runs after publication so a token problem can never block the snapshot.
      - name: Probe the serverless live-refresh path
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/probe-live-refresh.js

      - name: Close prior failure alerts after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label workflow-issue --search '"[Workflow] GitHub stars refresh failed" in:title' --json number --jq '.[].number' |
            while read issue; do
              gh issue close "$issue" --comment "Recovered in workflow run ${GITHUB_RUN_ID}."
            done

      - name: Open one actionable failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Workflow] GitHub stars refresh failed';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-issue',
              per_page: 100
            });

            // push-stars-snapshot.js writes this when GitHub could not resolve
            // catalog entries. Naming them here is the difference between a
            // 2-minute fix and a manual investigation — the generic body alone
            // left ndesv21/socialclaw breaking runs for ~26h (PR #662).
            // probe-live-refresh.js writes this when the Vercel-side token
            // cannot fetch. Checked first: it runs after publication, so if it
            // produced a report the snapshot itself succeeded and the token is
            // the actual finding.
            let detail = '';
            const read = (file) => {
              try { return fs.readFileSync(file, 'utf8'); } catch { return ''; }
            };
            detail = read('stars-probe.md') || read('stars-unavailable.md');
            if (!detail) {
              detail = 'Neither a probe report nor an unavailable-repo report was ' +
                'produced, so the snapshot failed before ingestion (network, auth, ' +
                'or a degraded API response). Check the run log.\n';
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled stars snapshot failed.\n\nRun: ${runUrl}\n\n${detail}`;
            const existing = open.find((issue) => issue.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['workflow-issue']
              });
              return;
            }

            // This workflow runs every 6h, so an unfixed dead repo would post 4
            // identical comments a day and bury the one that matters. Comment
            // only when the diagnosis actually changed; the run link alone is
            // not a change worth notifying for.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              per_page: 100
            });
            const lastBody = comments.length ? comments[comments.length - 1].body : existing.body;
            const withoutRunUrl = (text) => String(text || '').replace(/Run: \S+/g, '').trim();

            if (withoutRunUrl(lastBody) === withoutRunUrl(body)) {
              core.info(`Issue #${existing.number} already reports this exact failure — not re-commenting.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body
            });
