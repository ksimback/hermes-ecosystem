name: PR Preview Smoke Test

# Runs the existing Atlas smoke test against the Vercel preview URL before merge.
# This keeps Ask the Atlas/project-page regressions out of main: malformed data,
# missing generated pages, sitemap drift, broken critical pages, and stale links
# should fail the PR instead of becoming a production revert.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/**'
      - 'projects/**'
      - 'guide/**'
      - 'dev/**'
      - 'lists/**'
      - 'use-cases/**'
      - '*.html'
      - '*.xml'
      - 'llms.txt'
      - 'robots.txt'
      - 'index.html'
      - 'vercel.json'
      - 'lib/**'
      - 'api/**'
      - 'scripts/build-pages.js'
      - 'scripts/build-chunks.js'
      - 'scripts/smoke-test-prod.js'
      - '.github/workflows/smoke-test-pr.yml'

concurrency:
  group: pr-preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Wait for Vercel preview URL
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            // Vercel creates a successful GitHub Deployment record before the
            // build finishes. Its environment_url can therefore serve the
            // previous artifact for several seconds. Use the 'Vercel' commit
            // status only as the readiness gate, then use the Deployment
            // status's environment_url as the real, fetchable preview origin.
            // (The commit status target_url is a vercel.com dashboard URL and
            // must never be probed as the deployment itself.)
            const sha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MAX_WAIT_MS = 10 * 60 * 1000;
            const INTERVAL_MS = 15 * 1000;
            const start = Date.now();

            core.info(`Polling Vercel preview deployment for PR #${context.payload.pull_request.number} @ ${sha}`);

            while (Date.now() - start < MAX_WAIT_MS) {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: sha,
              });
              const vercelStatus = combined.statuses.find((s) => s.context === 'Vercel');
              if (vercelStatus?.state === 'failure' || vercelStatus?.state === 'error') {
                core.setFailed(`Vercel preview build failed for ${sha}`);
                return;
              }
              if (vercelStatus?.state !== 'success') {
                core.info(`Vercel build is ${vercelStatus?.state || 'not reported'}; waiting before probing the deployment`);
                await new Promise((resolve) => setTimeout(resolve, INTERVAL_MS));
                continue;
              }

              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, per_page: 10,
              });
              const previews = deployments.filter((d) => /preview/i.test(d.environment || ''));

              for (const dep of previews) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: dep.id, per_page: 5,
                });
                const done = statuses.find((s) => s.state === 'success' && s.environment_url);
                if (done) {
                  if (!/^https:\/\//.test(done.environment_url) || done.environment_url.includes('vercel.com/')) {
                    core.setFailed(`environment_url does not look like a deployment origin: ${done.environment_url}`);
                    return;
                  }
                  core.setOutput('base_url', done.environment_url);
                  core.info(`Vercel preview ready: ${done.environment_url}`);
                  return;
                }
                if (statuses.find((s) => s.state === 'failure' || s.state === 'error')) {
                  core.setFailed(`Vercel preview deployment failed for ${sha}; smoke test cannot run`);
                  return;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, INTERVAL_MS));
            }

            core.setFailed('Timed out waiting for Vercel preview deploy (10min)');

      - name: Wait for exact preview artifact
        env:
          SMOKE_BASE: ${{ steps.vercel.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set"
            exit 1
          fi
          deployed_repos="$(mktemp)"
          deployed_llms="$(mktemp)"
          trap 'rm -f "$deployed_repos" "$deployed_llms"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$SMOKE_BASE/data/repos.json" \
              --output "$deployed_repos" \
              && curl --fail --silent --show-error \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$SMOKE_BASE/llms.txt" \
              --output "$deployed_llms" \
              && cmp --silent data/repos.json "$deployed_repos" \
              && cmp --silent llms.txt "$deployed_llms"; then
              echo "Preview is serving this checkout's repos.json and llms.txt (attempt $attempt)"
              exit 0
            fi
            echo "Preview artifact is not current yet (attempt $attempt/40); waiting 15s"
            sleep 15
          done
          echo "::error::Preview never served this checkout's repos.json and llms.txt"
          exit 1

      - name: Run smoke test against preview
        id: smoke
        # Pass the preview URL via env, never interpolated straight into the
        # shell command.
        #
        # VERCEL_AUTOMATION_BYPASS_SECRET: preview deployments sit behind
        # Vercel Authentication; the script sends the secret as the
        # x-vercel-protection-bypass header. Guarded loudly below — without it
        # every probe would 401 and the failure cause would be unobvious.
        # NOTE: secrets are not available to PRs from forks, so fork-submitted
        # PRs fail here by design (fork previews also require manual
        # authorization on Vercel) — a maintainer reviews and merges those by
        # hand.
        #
        # `set -o pipefail`: without it, `node ... | tee` reports tee's exit
        # code and a failing smoke run turns into a green check — the silent
        # failure that let this gate pass while probing the wrong host.
        env:
          SMOKE_BASE: ${{ steps.vercel.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -o pipefail
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set (repo secret missing, or this is a fork PR — secrets are withheld from forks). Preview probes would all 401."
            exit 1
          fi
          node scripts/smoke-test-prod.js \
            --base "$SMOKE_BASE" \
            --sample "25" \
            --preview \
            --continue \
            | tee smoke-output.txt

      - name: Comment with failure summary
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let smokeOutput = '';
            try {
              smokeOutput = fs.readFileSync('smoke-output.txt', 'utf8');
            } catch (error) {
              smokeOutput = '(smoke-output.txt not produced — check the workflow log)';
            }

            const body = [
              'PR preview smoke test failed.',
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              smokeOutput.slice(-3500),
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
